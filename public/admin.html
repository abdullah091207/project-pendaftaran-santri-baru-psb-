<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Panel Admin PSB</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #40E0D0, purple);
            /* Tosca → Benhur */
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: white;
        }

        #loginArea,
        #adminContent {
            background: skyblue;
            max-width: 700px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        input {
            width: 80%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: 0.3s;
        }

        input:focus {
            border-color: #40E0D0;
            /* Tosca */
            outline: none;
            box-shadow: 0 0 5px #40E0D0;
        }

        button {
            padding: 10px 20px;
            background: #0F52BA;
            /* Benhur */
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }

        button:hover {
            background: #40E0D0;
            /* Tosca */
            color: #0F52BA;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #0F52BA;
            /* Benhur */
            color: white;
        }

        th,
        td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        tr:hover {
            background: #e0ffff;
            /* Tosca muda */
        }

        hr {
            border: none;
            height: 2px;
            background: darkslateblue;
            margin: 20px 0;
        }
    </style>

</head>

<body>
    <div id="loginArea">
        <h2>Login Admin</h2>
        <input type="text" id="user" placeholder="Username"><br><br>
        <input type="password" id="pass" placeholder="Password"><br><br>
        <button onclick="login()">Masuk</button>
    </div>

    <div id="adminContent" style="display:none;">
        <h2>Data Pendaftar Santri</h2>
        <button onclick="logout()">Logout</button>
        <hr>
        <table border="1" cellpadding="10" id="tabelSantri">
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Gender</th>
                    <th>Hafalan</th>
                    <th>Wali</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        async function login() {
            const formData = new FormData();
            formData.append('username', document.getElementById('user').value);
            formData.append('password', document.getElementById('pass').value);

            const res = await fetch('/api/login', { method: 'POST', body: formData });
            if (res.ok) {
                checkAuth();
            } else {
                alert("Login Gagal!");
            }
        }

        async function checkAuth() {
            const res = await fetch('/api/admin/santri');
            if (res.ok) {
                const data = await res.json();
                document.getElementById('loginArea').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';

                const tbody = document.querySelector('#tabelSantri tbody');
                tbody.innerHTML = data.map(s => `
                    <tr>
                        <td>${s.nama}</td>
                        <td>${s.gender}</td>
                        <td>${s.hafalan} Juz</td>
                        <td>${s.wali}</td>
                    </tr>
                `).join('');
            }
        }

        async function logout() {
            await fetch('/api/logout');
            location.reload();
        }

        // Cek status login saat halaman dibuka
        checkAuth();
    </script>
</body>
</html>
